<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilttolast</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: 12px;
    }

    p {
      color: #ccc;
      font-size: 1.1rem;
    }

    .hero-image {
      display: block;
      width: 100%;
      max-width: 900px;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <main>
  <img
      class="hero-image"
      src="Metallic Construction Coming Soon Splash.png"
      alt="Bilttolast featured picture"
    >
  </main>
</body>
</html>
